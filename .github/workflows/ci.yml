name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: reserveroute-fixtures
      - uses: actions/checkout@v4
        with:
          repository: reserveroute/reserveroute-engine
          ref: main
          path: reserveroute-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: reserveroute-fixtures
